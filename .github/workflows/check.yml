name: check
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  rebuild-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Rebuild from data/raw/ (offline) and compare with the committed outputs
        run: make check
      - name: Tests
        run: make test
